# Copy this file to .github/workflows/ef-migration-lint.yml in your repository.
#
# Lints EF Core migration files that a pull request adds or modifies.
# Needs no secrets and only read access, so it behaves the same on fork PRs.
name: EF migration lint

on:
  pull_request:
    # labeled/unlabeled re-run the check when the override label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '**/Migrations/**'

permissions:
  contents: read

jobs:
  lint-migrations:
    name: Lint changed migrations
    # Override for a destructive migration your team has reviewed and accepted.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to diff against the base branch
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x' # the tool also runs on 8.0.x

      - name: Install ef-migration-lint
        # Pinned, so a new release never changes your check without a PR. If you use a local tool
        # manifest (dotnet-tools.json), run `dotnet tool restore` here instead and call
        # `dotnet tool run ef-migration-lint` in the next step.
        run: dotnet tool install --global EfMigrationLint --version 0.1.0

      - name: Lint added or modified migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NUL-separated so paths with spaces stay intact. Deleted files are excluded (AM = added, modified).
          # Designer and ModelSnapshot files may be listed; the tool skips them.
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- ':(glob)**/Migrations/**/*.cs')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No added or modified migration files."
            exit 0
          fi

          printf 'Linting %s file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          # Exit code 0 = no errors, 1 = error findings, 2 = scan incomplete.
          ef-migration-lint --format github -- "${files[@]}"
